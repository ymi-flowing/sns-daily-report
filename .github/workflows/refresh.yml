name: Refresh Dashboard

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI and API

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          RESMAN_API_KEY: ${{ secrets.RESMAN_API_KEY }}
          RESMAN_PARTNER_ID: ${{ secrets.RESMAN_PARTNER_ID }}
          RESMAN_ACCOUNT_ID: ${{ secrets.RESMAN_ACCOUNT_ID }}
        run: python generate_dashboard.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add dashboard_live.html dashboard.xlsx renewal_summary.json alerts_state.json data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-refresh dashboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          for i in $(seq 1 30); do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; rebasing on origin/main and retrying..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "Giving up after 30 push attempts."
          exit 1
